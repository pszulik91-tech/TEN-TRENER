<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Publisher display QA — internal</title><style>body{margin:0;background:#bbb}header{position:sticky;top:0;background:#fff;padding:8px;z-index:9}button{margin:4px;padding:6px}iframe{display:block;border:0;background:#fff}</style><header>Internal QA • actual app viewport <span id="size"></span><div id="controls"></div></header><iframe id="game" title="Publisher game" src="/" width="1366" height="768"></iframe><script>const sizes=[[1920,1080],[1366,768],[1440,900],[1280,720],[390,844],[412,915]];const frame=document.getElementById('game');for(const [w,h] of sizes){const b=document.createElement('button');b.textContent=`${w}×${h}`;b.onclick=()=>{frame.width=w;frame.height=h;document.getElementById('size').textContent=b.textContent};document.getElementById('controls').append(b);}</script></html>
