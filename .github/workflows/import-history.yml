name: Import verified TEN TRENER history
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: initial-history-import
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'pszulik91-tech/TEN-TRENER' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify source and merge complete existing history
        shell: bash
        run: |
          set -euo pipefail
          test -f ten-trener-history.bundle
          echo '8b317b7a28a9cce0a09891aca287724d44d7e2bd94cb0949436fe2d885da4ad1  ten-trener-history.bundle' | sha256sum --check
          git bundle verify ten-trener-history.bundle
          git fetch ./ten-trener-history.bundle refs/heads/main:refs/remotes/legacy/main
          test "$(git rev-parse refs/remotes/legacy/main)" = '1c036ef84e4ae01eaec5dd215743ba9028e1233c'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-ff --no-commit --allow-unrelated-histories refs/remotes/legacy/main
          git rm ten-trener-history.bundle
          git commit -m 'Import TEN TRENER Pre-Alpha 0.1.0 with complete development history'
          git merge-base --is-ancestor 1c036ef84e4ae01eaec5dd215743ba9028e1233c HEAD
          git diff --exit-code refs/remotes/legacy/main HEAD -- . ':!.github/workflows/import-history.yml'
          git push origin HEAD:main
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run test:http
      - uses: actions/upload-artifact@v4
        with:
          name: ten-trener-pre-alpha-0.1.0
          path: dist
