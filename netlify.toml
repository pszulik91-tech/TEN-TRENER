[build]
  command = "npm run build && npm run test:regression"
  publish = "dist"

[build.environment]
  # Node is pinned in the root .nvmrc, shared with local development and CI.
  NPM_FLAGS = "--no-audit --no-fund"

# One build configuration for production, PR previews and branch previews.
# Enable GitHub integration in the Netlify project; credentials never live here.
[context.deploy-preview]
  command = "npm run build && npm run test:regression"

[context.branch-deploy]
  command = "npm run build && npm run test:regression"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
